name: CI

on:
  push:
    branches:
      - main
      - ci-*
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-checks:
    name: Nix checks (writer-assistant)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Format
        run: nix build ./writer-assistant#checks.x86_64-linux.format

      - name: Lint
        run: nix build ./writer-assistant#checks.x86_64-linux.lint

      - name: Build
        run: nix build ./writer-assistant#checks.x86_64-linux.build

      - name: Test
        run: nix build ./writer-assistant#checks.x86_64-linux.test
