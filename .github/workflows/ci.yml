name: CI

on:
  push:
    branches:
      - main
      - ci-*
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-checks:
    name: Nix checks (writer-assistant)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Install npm deps
        run: cd writer-assistant && nix develop -c npm ci --frozen-lockfile

      - name: Format
        run: cd writer-assistant && nix develop -c npx prettier --check .

      - name: Lint
        run: cd writer-assistant && nix develop -c npx eslint "**/*.ts" --ignore-pattern "dist/" --ignore-pattern "node_modules/"

      - name: Build
        run: cd writer-assistant && nix develop -c npm run build

      - name: Test
        run: cd writer-assistant && nix develop -c npm test
