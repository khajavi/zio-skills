name: CI # test run

on:
  push:
    branches:
      - main
      - ci-*
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-checks:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    strategy:
      matrix:
        project: [writer-assistant]

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: FlakeHub cache
        uses: DeterminateSystems/flakehub-cache-action@main

      - name: Check flake lock file health
        uses: DeterminateSystems/flake-checker-action@main
        with:
          flake-lock-path: ${{ matrix.project }}/flake.lock

      - name: nix flake check (${{ matrix.project }})
        run: cd ${{ matrix.project }} && nix flake check
